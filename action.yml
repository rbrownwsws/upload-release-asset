# $schema=https://www.schemastore.org/github-action.json
name: "Upload Release Asset"
description: "Upload an asset to a GitHub Release."

inputs:
  upload-url:
    description: "URL to use to upload the asset (you get this when you create the Release)."
    required: true
  github-api-token:
    description: "The GitHub API token to use for authentication"
    required: false
    default: ${{ github.token }}
  path:
    description: "The path to the file(s) to upload. May be a glob pattern."
    required: true
  content-type:
    description: "The Content-Type of the file to upload"

runs:
  using: "composite"

  steps:
    - name: "Upload asset"
      shell: bash
      env:
        UPLOAD_URL: ${{ inputs.upload-url }}
        GITHUB_API_TOKEN: ${{ inputs.github-api-token }}
        ASSETS_PATH: ${{ inputs.path }}
        CONTENT_TYPE: ${{ inputs.content-type }}
      run: |
        set -euo pipefail
        
        SCRIPT="${GITHUB_ACTION_PATH}/upload-release-asset.sh"
        chmod +x "${SCRIPT}"
        "${SCRIPT}"
